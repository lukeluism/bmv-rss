name: Update feed

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths:
      - 'scraper.py'
      - 'requirements.txt'
      - 'test_scraper.py'
      - '.github/workflows/update-feed.yml'

# Schreib-/Deploy-Rechte nur für Jobs auf dem Standardbranch.
permissions:
  contents: read

concurrency:
  group: bmv-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Test parsing and failure handling
        run: python -m unittest -v

      - name: Fetch releases and build feed
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scraper.py --pages 3

      - name: Persist release history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BMV release history"
            git push
          fi

      - name: Add run summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('public/status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### BMV-Abruf\n\n')
              for key, value in status.items():
                  f.write(f'- **{key}**: {value}\n')
          PY

      - name: Upload validated feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish feed
        id: deployment
        uses: actions/deploy-pages@v4
